name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2

      - name: Build
        run: make lin

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: lin-windows-x64
          path: lin.exe